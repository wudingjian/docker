# 给整个自动化流程起个名字（显示在 GitHub Actions 页面）
name: Build and Push ChatGPT-Next-Web Image

# 什么时候触发
on:
  # 允许手动触发：在 GitHub 网页上点 Run workflow
  workflow_dispatch:
  # 每天 UTC 0 点（北京时间早上 8 点）自动运行
  # schedule:
    # - cron: "0 0 * * *"

# 要执行的任务
jobs:
  build:
    runs-on: ubuntu-latest          # 使用 GitHub 提供的 Ubuntu 服务器
    timeout-minutes: 120            # 最长运行 120 分钟

    steps:
      # 1️⃣ 安装 QEMU（用于构建 amd64 和 arm64 两种架构）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2️⃣ 安装 Docker Buildx（支持跨平台构建的扩展工具）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ 登录 Docker Hub（需要提前在 GitHub Secrets 里配置 DOCKER_USERNAME 和 DOCKERHUB_TOKEN）
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # 注意：这里用的是 DOCKERHUB_TOKEN

      # 4️⃣ 生成镜像标签：最新版 latest + 当前时间戳（例如 20250701-120000）
      #    同时输出 time_tag 给后面的清理步骤使用
      - name: Generate image tags
        id: tags
        run: |
          TIME_TAG="$(date +%Y%m%d-%H%M%S)"
          # 输出两个标签：latest 和 当前时间戳
          echo "tags=jsntwdj/chatgpt-next-web:latest,jsntwdj/chatgpt-next-web:${TIME_TAG}" >> "$GITHUB_OUTPUT"
          # 输出当前时间戳对应的完整镜像名，用于清理脚本
          echo "time_tag=jsntwdj/chatgpt-next-web:${TIME_TAG}" >> "$GITHUB_OUTPUT"

      # 5️⃣ 构建并推送镜像到 Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # 构建代码来源：直接使用上游仓库 NextChat 的 main 分支，无需 fork
          context: https://github.com/ChatGPTNextWeb/NextChat.git#main
          file: Dockerfile
          # 构建两个 CPU 架构
          platforms: linux/amd64,linux/arm64
          # 构建完成直接推送到 Docker Hub
          push: true
          # 使用第 4 步生成的标签（latest + 时间戳）
          tags: ${{ steps.tags.outputs.tags }}
          # 启用 GitHub Actions 缓存，加速下次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6️⃣ 清理旧标签：只保留 latest + 最近两个时间戳（当次 + 上次）
      - name: Clean old Docker Hub tags
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e   # 遇到错误立即停止

          # 通过 Docker Hub API 登录，获取临时 token
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -d "{\"username\":\"${USERNAME}\", \"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ 获取 Docker Hub token 失败"
            exit 1
          fi

          REPO="jsntwdj/chatgpt-next-web"   # 你的 Docker Hub 仓库名
          KEEP_LATEST="latest"              # 固定保留的标签

          # 获取仓库当前所有标签（一页最多 100 个）
          TAGS_JSON=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${REPO}/tags/?page_size=100")

          # 把所有标签名存入 ALL_TAGS 数组
          mapfile -t ALL_TAGS < <(echo "$TAGS_JSON" | jq -r '.results[]?.name')

          echo "📋 当前所有 tags：${ALL_TAGS[*]}"

          # 从所有标签中排除 latest，剩下的都是时间戳标签
          declare -a TS_TAGS=()
          for TAG in "${ALL_TAGS[@]}"; do
            if [ "$TAG" != "$KEEP_LATEST" ]; then
              TS_TAGS+=("$TAG")
            fi
          done

          # 把时间戳标签按从大到小排序，最新的排最前面
          IFS=$'\n' sorted=($(sort -r <<<"${TS_TAGS[*]}")); unset IFS

          # 保留列表：latest + 前两个最新时间戳（当次 + 上次）
          KEEP_TAGS=("$KEEP_LATEST")
          for t in "${sorted[@]:0:2}"; do
            [ -n "$t" ] && KEEP_TAGS+=("$t")
          done

          echo "✅ 保留的 tags：${KEEP_TAGS[*]}"

          # 遍历所有旧标签，删除不在保留列表里的
          for TAG in "${ALL_TAGS[@]}"; do
            if [[ ! " ${KEEP_TAGS[@]} " =~ " $TAG " ]]; then
              echo "🗑️ 删除旧 tag：${TAG}"
              # 调用 Docker Hub API 删除该标签
              curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" || true
            fi
          done

          echo "🎉 清理完成，现在仓库只剩：${KEEP_TAGS[*]}"
