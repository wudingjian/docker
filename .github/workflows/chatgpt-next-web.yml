# 给整个自动化流程起个名字（就显示在 GitHub Actions 页面上的名字，可以随便取）
name: Build and Push ChatGPT-Next-Web Image

# “on” 表示什么时候触发这个自动化流程
on:
  # 允许你手动触发：在 GitHub 网页上点 “Run workflow” 按钮就能立刻跑一次
  workflow_dispatch:

  # 定时触发
  # schedule:
    # cron 表达式，表示每天 UTC 时间 0 点执行一次
    # UTC 0 点 = 北京时间早上 8 点
    # - cron: "0 0 * * *"

# “jobs” 定义了这个流程里要执行的任务
jobs:
  # 任务名，叫 build（可以随便起）
  build:
    # 运行在最新版的 Ubuntu Linux 服务器上（GitHub 免费提供的）
    runs-on: ubuntu-latest

    # 这个任务最多运行 120 分钟，超过时间会被强制终止，防止卡住
    timeout-minutes: 120

    # “steps” 是具体的一步步操作，从上到下依次执行
    steps:
      # 步骤1：安装 QEMU（一个模拟器）
      # 作用：让 Docker 可以同时构建不同 CPU 架构的镜像（比如 amd64 和 arm64）
      - name: Set up QEMU
        # 使用 GitHub 官方提供的 QEMU 安装工具，版本是 v3
        uses: docker/setup-qemu-action@v3

      # 步骤2：安装 Docker Buildx（Docker 的扩展构建工具）
      # 作用：支持跨平台构建、更好地利用缓存
      - name: Set up Docker Buildx
        # 使用 GitHub 官方提供的 Buildx 工具，版本是 v3
        uses: docker/setup-buildx-action@v3

      # 步骤3：登录 Docker Hub
      # 作用：只有登录了，才有权限把镜像推送到 Docker Hub
      - name: Log in to Docker Hub
        # 使用 GitHub 官方提供的 Docker 登录工具，版本是 v3
        uses: docker/login-action@v3
        with:
          # 登录用户名从 GitHub 仓库的 Secret 里读取
          # Secret 相当于加密保存的密码，不会直接写死在这里
          username: ${{ secrets.DOCKER_USERNAME }}
          # 登录密码（或访问令牌）也从 Secret 里读取
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 步骤4：生成镜像标签（tag）
      # 作用：给镜像打上多个版本号，比如 latest 和今天日期
      - name: Generate image tags
        # 给这个步骤起个“别名”，后面可以用 steps.tags.outputs.tags 拿到结果
        id: tags
        # 执行一段 shell 命令
        run: |
          # 往 GitHub Actions 的输出文件里写入一行标签信息
          # 一行里有 2 个标签，用逗号分隔：
          # 第一个是 jsntwdj/chatgpt-next-web:latest（固定最新版）
          # 第二个是 jsntwdj/chatgpt-next-web:20250617-081500（按当前时间自动生成）
          echo "tags=jsntwdj/chatgpt-next-web:latest,jsntwdj/chatgpt-next-web:$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      # 步骤5：真正构建并推送 Docker 镜像
      - name: Build and push
        # 使用 GitHub 官方提供的 Docker 构建推送工具，版本是 v5
        uses: docker/build-push-action@v5
        with:
          # 构建上下文（也就是代码从哪里来）
          # 这里直接使用上游仓库 ChatGPTNextWeb/NextChat 的 main 分支
          # 注意：不需要 fork 那个仓库，GitHub Actions 会自动去下载它的代码
          context: https://github.com/ChatGPTNextWeb/NextChat.git#main

          # 指定使用上游仓库根目录里的 Dockerfile 来构建
          file: Dockerfile

          # 指定构建哪些 CPU 平台：
          # linux/amd64 （普通电脑/服务器）
          # linux/arm64 （ARM 架构，如树莓派、很多云服务器）
          platforms: linux/amd64,linux/arm64

          # 构建完成后直接推送到 Docker Hub
          push: true

          # 使用步骤4 生成的标签，也就是你要求的
          # jsntwdj/chatgpt-next-web:latest
          tags: ${{ steps.tags.outputs.tags }}

          # 下面两行是开启 GitHub Actions 缓存
          # 这样下次构建时，重复的部分不用重新下载，速度会快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
